<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Antoine de Maintenant — BI & AI Automation Specialist. I turn manual reporting chaos into autonomous intelligence. 5+ years CPG, SaaS & CSR. Available worldwide.">
<meta name="author" content="Antoine de Maintenant">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<!-- React 18.2.0 -->
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<!-- Three.js r128 -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<!-- Chart.js 4.4.0 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- D3 v7.8.5 -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<!-- TopoJSON 3.1.0 -->
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body data-theme="dark">

<!-- PROFILE SELECTOR — Matrix style -->
<div id="ps-overlay">
  <canvas id="ps-matrix"></canvas>
  <div id="ps-inner">
    <div id="ps-logo-wrap">
      <div id="ps-logo">ADM<span>.</span></div>
      <div id="ps-tagline">Antoine de Maintenant</div>
    </div>
    <div id="ps-q"></div>
    <div id="ps-pills">
      <button class="ps-pill ps-pill-blue" onclick="psChoose('human')">
        <span class="ps-pill-dot"></span>
        <span class="ps-pill-label" id="ps-human-lbl">For decision-makers</span>
      </button>
      <button class="ps-pill ps-pill-red" onclick="psChoose('tech')">
        <span class="ps-pill-dot"></span>
        <span class="ps-pill-label" id="ps-tech-lbl">For engineers</span>
      </button>
    </div>
    <div id="ps-lang-row">
      <button class="ps-lang-btn" id="ps-fr" onclick="psSetLang('fr')">FR</button>
      <span class="ps-lang-sep">/</span>
      <button class="ps-lang-btn active" id="ps-en" onclick="psSetLang('en')">EN</button>
    </div>
  </div>
</div>

<!-- BOOT SCREEN (starts hidden, shown only for tech mode) -->
<div id="boot" style="display:none;position:fixed;inset:0;background:#000;z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .6s">
  <div class="boot-logo">ADM<span>.</span>SYS</div>
  <div class="boot-lines" id="boot-lines"></div>
  <div class="boot-bar-wrap"><div class="boot-bar" id="boot-bar"></div></div>
</div>

<!-- THREE.JS CANVAS -->
<canvas id="three-canvas"></canvas>
<div class="grid-bg"></div>
<div class="scanline"></div>

<!-- CURSOR -->
<div id="cur-o"></div>
<div id="cur-i"></div>

<!-- SCROLL PROGRESS -->
<div class="scroll-bar" id="sbar"></div>

<!-- HIRE PROGRESS -->
<div id="hire-progress"><div class="hire-fill" id="hire-fill"></div></div>

<!-- XP HUD -->
<div id="xp-hud">
  <div class="xp-title"><span>XP</span><span id="xp-level">LV.1</span></div>
  <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>
  <div class="xp-pts" id="xp-pts">0</div>
  <div class="xp-lv" id="xp-label">Explore to earn XP</div>
</div>

<!-- ACHIEVEMENT TOAST -->
<div class="achieve-toast" id="achieve-toast">
  <div class="achieve-icon" id="achieve-icon">🏆</div>
  <div>
    <div class="achieve-text">Achievement Unlocked</div>
    <div class="achieve-title" id="achieve-title">—</div>
  </div>
</div>

<!-- CHAPTER NAV -->
<div id="chapter-nav"></div>

<div class="konami-hint">↑ ↑ ↓ ↓ ← → ← → B A</div>
<div id="root"></div>

<script src="app.js"></script>
<script src="main.js"></script>
</body>
</html>
